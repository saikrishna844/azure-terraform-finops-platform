name: Terraform PR Plan

on:
  pull_request:
    branches:
      - main

permissions:
  id-token: write
  contents: read

jobs:
  terraform-plan:
    name: Terraform DEV Plan
    runs-on: ubuntu-latest

    environment: dev

    env:
      ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      TF_VAR_subscription_id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4

      - name: Prepare SSH Public Key
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p "$HOME/.ssh"

          echo "Generating temporary SSH key for Terraform PR plan..."

          ssh-keygen \
            -t rsa \
            -b 4096 \
            -f "$HOME/.ssh/finops_vm" \
            -N "" \
            -C "github-actions-terraform-plan" \
            -q

          chmod 600 "$HOME/.ssh/finops_vm"
          chmod 644 "$HOME/.ssh/finops_vm.pub"

          echo "Validating generated SSH public key..."
          ssh-keygen -l -f "$HOME/.ssh/finops_vm.pub"

          echo "SSH public key created successfully."

      - name: Terraform Format Check
        run: terraform fmt -check -recursive

      - name: Azure Login with OIDC
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Terraform Init
        working-directory: environments/dev
        run: terraform init -input=false

      - name: Terraform Validate
        working-directory: environments/dev
        run: terraform validate

      - name: Terraform Plan
        working-directory: environments/dev
        run: |
          terraform plan \
            -input=false \
            -no-color \
            -var-file=ci.tfvars